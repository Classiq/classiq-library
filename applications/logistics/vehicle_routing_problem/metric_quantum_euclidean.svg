<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="100%" height="100%" style="background:#090D16; border-radius:8px; border:1px solid rgba(245,158,11,0.25);">
  <defs>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title Badge -->
  <rect x="20" y="14" width="260" height="22" rx="4" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.35)"/>
  <text x="30" y="29" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B">QUANTUM HILBERT-EUCLIDEAN (L2)</text>
  <text x="430" y="29" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">|| |ψ⟩ - |c⟩ ||_2 in H-Space</text>

  <!-- Coordinate Axes in Hilbert Space -->
  <g transform="translate(60, 160)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="245" y="4" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">|e_0⟩</text>
    <text x="-12" y="-124" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">|e_1⟩</text>
    <text x="-12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">|0⟩</text>

    <!-- Vector |c> -->
    <line x1="0" y1="0" x2="180" y2="-35" stroke="#F59E0B" stroke-width="2.5"/>
    <polygon points="180,-35 168,-40 172,-32" fill="#F59E0B"/>
    <text x="188" y="-30" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#F59E0B">|c⟩ (Centroid)</text>

    <!-- Vector |psi> -->
    <line x1="0" y1="0" x2="110" y2="-105" stroke="#00F0FF" stroke-width="2.5"/>
    <polygon points="110,-105 102,-95 108,-98" fill="#00F0FF"/>
    <text x="116" y="-108" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00F0FF">|ψ⟩ (Work Order)</text>

    <!-- Vector Difference: |psi - c> (Direct Euclidean Chord) -->
    <line x1="180" y1="-35" x2="110" y2="-105" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#glowAmber)"/>
    <circle cx="145" cy="-70" r="14" fill="#0F172A" stroke="#F43F5E" stroke-width="1.2"/>
    <text x="139" y="-66" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FDA4AF">D_Q</text>
  </g>

  <!-- Right Explanatory Panel -->
  <g transform="translate(360, 55)">
    <rect x="0" y="0" width="215" height="125" rx="6" fill="#111827" stroke="rgba(255,255,255,0.08)"/>
    <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Vector Metric Equivalence</text>
    <text x="14" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F59E0B">D_Q = √⟨ψ-c | ψ-c⟩</text>
    <text x="14" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FDA4AF">    = √(2·(1 - Re⟨ψ|c⟩))</text>
    <line x1="14" y1="76" x2="200" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="14" y="94" font-family="'Inter', sans-serif" font-size="10.5" fill="#94A3B8">• Direct classical L2 transfer</text>
    <text x="14" y="110" font-family="'Inter', sans-serif" font-size="10.5" fill="#94A3B8">• Zero distortion on normalized data</text>
  </g>
</svg>