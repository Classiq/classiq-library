name: "Test Library CI (main)"

on:
  push:
    branches:
      - main

  # PRs (including forks)
  pull_request:
    branches:
      - main

  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    concurrency:
      # workflow  : the workflow name
      # event_name: "pull_request" / "workflow_dispatch" / ...
      # number    : the PR number
      # sha       : used mostly by "workflow_dispatch" and "push": will be the sha of the HEAD commit
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true

    steps:
      #
      # Setup Repository
      #
      - name: Checkout
        uses: actions/checkout@v7

      #
      # Setup Python
      #
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .github/.python-version

      - name: Install dependencies
        run: python -m pip install -U -r requirements_tests.txt

      # Run Tests
      - name: Run Notebooks (quick tests)
        run: python -m pytest -c tests/config_quick_tests.ini --rootdir=.
        env:
          SHOULD_TEST_ALL_FILES: "true" # quick tests should run all files
          LIMIT_TEST_LINKS_TO_FILES_ONLY: "true"
