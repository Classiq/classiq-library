name: "(Internal) Automatic Deployment"

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

jobs:
  # Single gate: only proceed when the PR was merged (not just closed).
  # Jobs below depend on this, so they are skipped on a non-merge close.
  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "PR merged into main - running deployments"

  deploy-prod:
    needs: on-merge
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/Utils-deployment-qmod.yml
    with:
      deploy-mode: production
    secrets: inherit

  deploy-staging:
    needs: on-merge
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/Utils-deployment-qmod.yml
    with:
      deploy-mode: staging
    secrets: inherit

  # Dual-write to the new-account buckets, alongside the jobs above. Non-blocking.
  deploy-new-accounts:
    needs: on-merge
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        deploy-mode: [staging, release_candidate, production]
    uses: ./.github/workflows/Utils-deployment-qmod-new-accounts.yml
    with:
      deploy-mode: ${{ matrix.deploy-mode }}
    secrets: inherit
