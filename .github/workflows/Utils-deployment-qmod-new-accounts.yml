name: "(Internal) Qmod Deployment (new accounts)"

# Parallel (dual-write) upload of the qmod library to the S3 buckets in the new
# AWS accounts, running alongside the existing Utils-deployment-qmod.yml upload.
# Role/region/bucket are resolved per deploy-mode. This job is non-blocking
# (continue-on-error on the AWS steps) so a failure here never fails the deploy.
# Follow-up ticket removes the old upload once consumers move to the new buckets.
#
# deploy-mode + GitHub environment match the existing workflow (staging,
# release_candidate, production); only the target buckets/regions/roles differ:
#   staging           -> dev account,  us-east-1, classiq-dev-ide-qmod-library-origin
#   release_candidate -> dev account,  us-west-2, classiq-pre-release-ide-qmod-library-origin
#   production        -> prod account, us-east-1, classiq-prod-us-east-1-ide-qmod-library-origin

on:
  workflow_dispatch:
    inputs:
      deploy-mode:
        description: "Deploy mode"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - release_candidate
          - production
  workflow_call:
    inputs:
      deploy-mode:
        description: "Deploy mode"
        type: string
        required: true

jobs:
  get-config:
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.get-config.outputs.environment }}
      qmod-bucket: ${{ steps.get-config.outputs.qmod-bucket }}
      aws-region: ${{ steps.get-config.outputs.aws-region }}
      branch: ${{ steps.get-config.outputs.branch }}
    steps:
      - id: get-config
        name: "Get Configuration from deploy-mode"
        env:
          INPUTS_BUILD_MODE: ${{ inputs.deploy-mode }}
        run: |
          set -ex

          case "$INPUTS_BUILD_MODE" in
            production)
              ENVIRONMENT=prod
              AWS_REGION="us-east-1"
              QMOD_BUCKET="classiq-prod-us-east-1-ide-qmod-library-origin"
              BRANCH="main"
              ;;
            release_candidate)
              ENVIRONMENT=prod
              AWS_REGION="us-west-2"
              QMOD_BUCKET="classiq-pre-release-ide-qmod-library-origin"
              BRANCH="main"
              ;;
            staging)
              ENVIRONMENT=staging
              AWS_REGION="us-east-1"
              QMOD_BUCKET="classiq-dev-ide-qmod-library-origin"
              BRANCH="main"
              ;;
            *)
              echo unknown
              exit 1
              ;;
          esac

          {
            echo "environment=${ENVIRONMENT}"
            echo "aws-region=${AWS_REGION}"
            echo "qmod-bucket=${QMOD_BUCKET}"
            echo "branch=${BRANCH}"
          } >>"$GITHUB_OUTPUT"

  main:
    needs: get-config
    env:
      QMOD_DIR: qmod
    name: Deploy QMOD app (new accounts)
    runs-on: ubuntu-24.04
    environment: ${{ needs.get-config.outputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      # We Checkout twice, once from main to get the latest actions, and second from dev to get QMODs
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          lfs: "false"
          sparse-checkout: ".github"
          sparse-checkout-cone-mode: false

      # production -> prod account role; staging and release_candidate -> dev account role
      - uses: aws-actions/configure-aws-credentials@v4.0.2
        continue-on-error: true
        with:
          role-to-assume: ${{ inputs.deploy-mode == 'production' && secrets.AWS_ROLE_PROD || secrets.AWS_ROLE_DEV }}
          aws-region: ${{ needs.get-config.outputs.aws-region }}
          mask-aws-account-id: true

      - name: Checkout qmod
        uses: actions/checkout@v7
        with:
          lfs: "false"
          path: qmod
          ref: ${{ needs.get-config.outputs.branch }}

      - name: Join QMOD Metadata
        run: |
          python3 .github/scripts/join_qmod_metadata.py "$QMOD_DIR" "$QMOD_DIR"/qmod_metadata.json

      - name: "Upload Qmod"
        continue-on-error: true
        env:
          QMOD_BUCKET: ${{ needs.get-config.outputs.qmod-bucket }}
        run: |
          set -e
          aws s3 sync "$QMOD_DIR" "s3://${QMOD_BUCKET}/latest" \
          --delete --exclude "*" --include "qmod_metadata.json" --include "*.qmod" --include "*.synthesis_options.json"
