name: "Test Library CI (weekly)"

on:
  schedule:
    - cron: "30 01 * * 6" # Saturday, 01:30 UTC
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  weekly-test:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .github/.python-version

      - name: Install dependencies
        run: python -m pip install -U -r requirements_tests.txt

      # Run Notebook Tests
      - name: Run Notebooks
        run: python -m pytest -c tests/config_weekly.ini tests/internal tests/test_*.py
        env:
          SHOULD_TEST_ALL_FILES: "true"

      # Summarize results for Slack copy-paste
      - name: Summarize test results
        if: always()
        run: python .github/scripts/summarize_test_results.py --workflow-name "internal"
