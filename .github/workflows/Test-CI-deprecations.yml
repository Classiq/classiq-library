name: "Test Library CI (deprecations)"

# Runs the notebooks with the classiq API mocked, and fails on deprecation warnings:
#   PRs: the notebooks whose code changed. Weekly: all notebooks.
# The job is off (`if: false`) until the notebooks are free of deprecations.

on:
  # PRs (including forks)
  pull_request:
    branches:
      - main

  schedule:
    - cron: "00 03 * * 6" # Saturday, 03:00 UTC

  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    if: false # TODO: remove once the notebooks are free of deprecations

    permissions:
      contents: read

    runs-on: ubuntu-latest

    concurrency:
      # workflow  : the workflow name
      # event_name: "pull_request" / "workflow_dispatch" / ...
      # number    : the PR number
      # sha       : used by "schedule" and "workflow_dispatch": the sha of the HEAD commit
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true

    steps:
      #
      # Setup Repository
      #
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the full history, to find the changed notebooks

      #
      # Setup Python
      #
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .github/.python-version

      - name: Install dependencies
        run: |
          # Install the lighter version of torch for the CI. We don't have a GPU anyway, and it saves ~2GB
          python -m pip install -U torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -U -r requirements.txt -r requirements_tests.txt -r requirements_notebooks.txt

      - name: Install couenne solver
        env:
          COIN_DIST_URL: https://github.com/ampl/coin/releases/download/v20191215/coin-linux64.tar.gz
          LOCAL_BIN: ${{ runner.temp }}/.local/bin
        run: |
          set -eux
          mkdir -p "$LOCAL_BIN"
          echo "$LOCAL_BIN" >>"$GITHUB_PATH"
          wget -nv -O- "$COIN_DIST_URL" | tar -C "$RUNNER_TEMP" -xvz
          cp "${RUNNER_TEMP}/couenne" "${LOCAL_BIN}/couenne"
          chmod ugo+x "${LOCAL_BIN}/couenne"

      #
      # Propagate CI information to python tests
      #
      - name: Get changed files
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          # Changes since the commit this ref branched from main
          BASE_SHA=$(git merge-base origin/main HEAD)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "notebooks=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ipynb' | xargs)" >> "$GITHUB_OUTPUT"
          echo "tests=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- ':(glob)**/notebooks/**/test_*.py' | xargs)" >> "$GITHUB_OUTPUT"

      # Narrow the changed-notebook list down to notebooks whose *code* cells changed,
      # so a markdown-only edit doesn't trigger the (expensive) notebook execution.
      - name: Filter to notebooks whose code cells changed
        id: code-changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.changed-files.outputs.base_sha }}
          ALL_CHANGED: ${{ steps.changed-files.outputs.notebooks }}
          # safety switch: set to "false" to fall back to the old "any change" behavior
          SKIP_MARKDOWN_ONLY: "true"
        run: |
          set -euo pipefail

          # Just the code-cell sources, in order (markdown, outputs, metadata ignored).
          extract_code_cells () {
              jq -S '
                  [ .cells[]
                    | select(.cell_type == "code")
                    | .source
                    | if type == "array" then join("") else . end
                  ]
              '
          }

          kept=()
          for notebook in $ALL_CHANGED; do
              if [ "$SKIP_MARKDOWN_ONLY" != "true" ]; then
                  # feature disabled -> keep every changed notebook
                  kept+=("$notebook")
              else
                  new_code=$(extract_code_cells < "$notebook")
                  if old_code=$(git show "$BASE_SHA:$notebook" 2>/dev/null | extract_code_cells 2>/dev/null); then
                      if [ "$old_code" != "$new_code" ]; then
                          kept+=("$notebook")   # code differs -> keep
                      fi
                  else
                      kept+=("$notebook")       # new notebook -> keep
                  fi
              fi
          done

          echo "list=${kept[*]}" >> "$GITHUB_OUTPUT"

      #
      # Run Tests
      #
      - name: Run Notebooks (mocked API, deprecation warnings)
        run: python -m pytest -c tests/config_deprecations.ini --rootdir=.
        env:
          SHOULD_TEST_ALL_FILES: ${{ github.event_name != 'pull_request' }}
          LIST_OF_IPYNB_CHANGED: ${{ steps.code-changed.outputs.list }}
          LIST_OF_IPYNB_TESTS_CHANGED: ${{ steps.changed-files.outputs.tests }}
          CLASSIQ_TELEMETRY_MODE: disabled
          CLASSIQ_HOST: http://127.0.0.1:9 # the API is mocked: nothing may reach the platform
