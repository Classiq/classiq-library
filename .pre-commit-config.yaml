default_language_version:
  python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        name: forbid    case conflict
      - id: check-executables-have-shebangs
        name: validate  shebangs
      - id: check-merge-conflict
        name: forbid    merge conflict
      - id: check-symlinks
        name: validate  symlinks
      - id: check-json
        name: validate  json
      - id: check-yaml
        name: validate  yaml
      - id: end-of-file-fixer
        name: format    end of file
      - id: trailing-whitespace
        name: format    trailing whitespace
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: format    prettier
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black-jupyter
        name: format    notebook black
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-isort
        name: format    notebook isort

  - repo: local
    hooks:
      - id: upgrade-nbformat
        name: format    nbformat upgrade
        entry: .internal/pre_commit_tools/set_nbformat.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
      - id: extra-nbstripout
        name: format    nbformat strip
        entry: .internal/pre_commit_tools/extra_nbstripout.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
      - id: verify-notebook-format-execution-count
        name: forbid    negative execution-count
        language: pygrep
        files: \.ipynb$
        entry: '"execution_count": -'

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: format    nbformat nbstripout
        args:
          [
            --keep-output,
            --keep-count,
            --drop-empty-cells,
            --keep-metadata-keys=cell.metadata.scrolled,
          ]

  - repo: local
    hooks:
      - id: verify-platform-links-nightly
        name: forbid    nightly-platform links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: https://nightly\.platform\.classiq\.io
      - id: verify-platform-links-dev
        name: forbid    dev-version links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: '[?&]version=[^ \t\n]*\.dev'
      - id: verify-platform-links-old
        name: forbid    older-version links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: '"Opening:\s+https://'
      - id: forbid-inline-images
        name: forbid    inline images
        entry: .internal/pre_commit_tools/notebook_forbid_inline_image.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true

      - id: validate-latex
        name: validate  notebook LaTeX
        description: Ensure LaTeX math expressions in markdown cells are valid
        entry: .internal/pre_commit_tools/notebook_validate_latex.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "latex2mathml"
          - "nbformat"
        require_serial: true

      - id: validate-notebook-names
        name: validate  notebook names
        entry: .internal/pre_commit_tools/notebook_validate_names.py
        language: python
        files: \.ipynb$
        require_serial: true
      - id: validate-qmod-names
        name: validate  qmod names
        entry: .internal/pre_commit_tools/qmod_validate_names.py
        language: python
        files: \.qmod$
        require_serial: true
      - id: validate-metadata-file
        name: validate  metadata
        description: Add file if non existant and validate value otherwise
        entry: .internal/pre_commit_tools/metadata_validate.py
        language: python
        files: \.(qmod|ipynb)$
        require_serial: true
      - id: auto-add-tests
        name: format    add tests
        description: Automatically adding a test to new notebooks
        entry: .internal/pre_commit_tools/auto_add_tests.py
        language: python
        files: \.ipynb$
        require_serial: true
      - id: notebook-uniformity
        name: format    uniformity
        description: Auto-fix simple uniformity conventions (e.g. plural "References" heading)
        entry: .internal/pre_commit_tools/notebook_uniformity.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
