repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        name: forbid    case conflict
      - id: check-executables-have-shebangs
        name: validate  shebangs
      - id: check-merge-conflict
        name: forbid    merge conflict
      - id: check-symlinks
        name: validate  symlinks
      - id: check-json
        name: validate  json
      - id: check-yaml
        name: validate  yaml
      - id: end-of-file-fixer
        name: format    end of file
      - id: trailing-whitespace
        name: format    trailing whitespace
      - id: mixed-line-ending
        name: format    line endings
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        name: format    unused imports
        # Third-party code copied into the library
        exclude: ^algorithms/error_correction/syndrome_extraction_optimization/(gidney_circuits|color_code_stim_local)/
        args: [--select, F401, --fix]
      - id: ruff-check
        name: format    notebook isort
        types_or: [jupyter]
        args: [--select, I, --fix]
      - id: ruff-format
        name: format    ruff
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        name: format    prettier

  - repo: local
    hooks:
      - id: upgrade-nbformat
        name: format    nbformat upgrade
        entry: .internal/pre_commit_tools/set_nbformat.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
      - id: extra-nbstripout
        name: format    nbformat strip
        entry: .internal/pre_commit_tools/extra_nbstripout.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
      - id: forbid-negative-execution-count
        name: forbid    negative execution-count
        language: pygrep
        files: \.ipynb$
        entry: '"execution_count": -'

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        name: format    nbformat nbstripout
        args: [--keep-output, --keep-count, --drop-empty-cells]

  - repo: local
    hooks:
      - id: forbid-nightly-platform-links
        name: forbid    nightly-platform links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: https://nightly\.platform\.classiq\.io
      - id: forbid-dev-version-links
        name: forbid    dev-version links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: '[?&]version=[^ \t\n]*\.dev'
      - id: forbid-older-version-links
        name: forbid    older-version links
        language: pygrep
        files: \.ipynb$
        exclude: (^|/)logical_qubits_by_alice_and_bob\.ipynb$
        entry: '"Opening:\s+https://'
      - id: forbid-inline-images
        name: forbid    inline images
        entry: .internal/pre_commit_tools/notebook_forbid_inline_image.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
      - id: forbid-deprecation-outputs
        name: forbid    deprecation warnings in outputs
        entry: .internal/pre_commit_tools/notebook_forbid_deprecation_outputs.py
        language: python
        files: \.ipynb$
        # These notebooks' outputs still show a deprecation warning.
        # Remove each one once it's fixed and re-run.
        exclude: |
          (?x)(^|/)(
            projected_based_embedding_tutorial|
            link_monitoring|
            portfolio_optimization|
            task_scheduling_problem|
            integer_linear_programming|
            evidence_scaling_labs|
            max_clique|
            max_k_vertex_cover|
            set_partition|
            ising_model|
            radio_access_network_positioning_antennas|
            benchmark_dynamical_localization|
            benchmark_ghz|
            modular_exp_example
          )\.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true

      - id: validate-latex
        name: validate  notebook LaTeX
        entry: .internal/pre_commit_tools/notebook_validate_latex.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "latex2mathml"
          - "nbformat"
        require_serial: true

      - id: forbid-classiq-named-imports
        name: forbid    from classiq import stuff (use `import *`)
        language: pygrep
        files: \.ipynb$
        # This file has `from classiq import A as B`
        exclude: (^|/)qaoa_demonstration\.ipynb$
        entry: "from classiq import [^*]"
      - id: forbid-classiq-raw-import
        name: forbid    import classiq (use `from classiq import *`)
        language: pygrep
        files: \.ipynb$
        # This file has `import classiq ; classiq.__version__`
        exclude: (^|/)stateprep_guassian_using_qsvt\.ipynb$
        entry: "\"\\s*import classiq(?!\\.)"
      - id: forbid-warning-filters
        name: forbid    warning filters (fix the warning instead)
        language: pygrep
        files: \.ipynb$
        entry: 'warnings\.(filterwarnings|simplefilter)\('

      - id: validate-notebook-names
        name: validate  notebook names
        entry: .internal/pre_commit_tools/notebook_validate_names.py
        language: python
        files: \.ipynb$
        require_serial: true
      - id: validate-qmod-names
        name: validate  qmod names
        entry: .internal/pre_commit_tools/qmod_validate_names.py
        language: python
        files: \.qmod$
        require_serial: true
      - id: validate-metadata-file
        name: validate  metadata
        entry: .internal/pre_commit_tools/metadata_validate.py
        language: python
        files: \.(qmod|ipynb)$
        require_serial: true
      - id: auto-add-tests
        name: format    add tests
        entry: .internal/pre_commit_tools/auto_add_tests.py
        language: python
        files: \.ipynb$
        require_serial: true
      - id: notebook-uniformity
        name: format    uniformity
        entry: .internal/pre_commit_tools/notebook_uniformity.py
        language: python
        files: \.ipynb$
        additional_dependencies:
          - "nbformat"
        require_serial: true
