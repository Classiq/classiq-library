[pytest]
addopts = --color=yes --log-cli-level=INFO --durations=0 --durations-min=1 --junit-xml=pytest-results/test-results.xml

#
# Common settings
#
python_files = test_*.py

filterwarnings =
  error
  # TODO: remove once classiq's function_params module stops referencing the
  # deprecated ast.Num node type (Python 3.12+ warns on access, removed in 3.14)
  ignore:ast\.Num is deprecated.*:DeprecationWarning
