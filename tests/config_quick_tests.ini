[pytest]
testpaths =
    tests

# directories to ignore
norecursedirs =
    tests/notebooks
    tests/qmods

addopts =
    --color=yes
    --log-cli-level=INFO

#
# Common settings
#
python_files = test_*.py

filterwarnings =
  error
  # TODO: remove once classiq's internal _synthesis_metadata stops reading
  # the deprecated Preferences.optimization_level field on every synthesize() call
  ignore:Preferences\.optimization_level is deprecated.*:DeprecationWarning
