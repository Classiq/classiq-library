[pytest]
testpaths =
    tests

# directories to ignore
norecursedirs =
    tests/notebooks
    tests/qmods

addopts =
    --color=yes
    --log-cli-level=INFO

#
# Common settings
#
python_files = test_*.py

filterwarnings =
  error
  # TODO: remove once classiq's internal _synthesis_metadata stops reading
  # the deprecated Preferences.optimization_level field on every synthesize() call
  ignore:Preferences\.optimization_level is deprecated.*:DeprecationWarning
  # TODO: remove once classiq's function_params module stops referencing the
  # deprecated ast.Num node type (Python 3.12+ warns on access, removed in 3.14)
  ignore:ast\.Num is deprecated.*:DeprecationWarning
